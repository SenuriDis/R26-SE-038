name: AI Test Review

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

on:
  pull_request:
  workflow_dispatch:
    inputs:
      max_functions:
        description: "How many functions to generate tests for"
        required: false
        default: "10"
        type: string

jobs:
  pull-request:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Analyse changed functions
        uses: ./
        with:
          groq-api-key: ${{ secrets.GROQ_API_KEY }}
          changed-only: "true"
          min-risk-level: "LOW"
          max-functions: "5"

  baseline:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rank the whole repository
        uses: ./
        with:
          groq-api-key: ${{ secrets.GROQ_API_KEY }}
          changed-only: "false"
          min-risk-level: "LOW"
          max-functions: ${{ inputs.max_functions || '10' }}
          comment-on-pr: "false"

      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-test-report
          path: .ai-test-artifacts/
          if-no-files-found: warn
