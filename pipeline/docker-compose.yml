services:
  pipeline-api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8005:8005"
    environment:
      PIPELINE_WORKSPACE: /workspace
      PIPELINE_CONTAINER_WORKSPACE: /workspace
      PIPELINE_CORS_ORIGINS: ${PIPELINE_CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173,http://localhost:5176,http://127.0.0.1:5176,http://localhost:5500,http://127.0.0.1:5500}
      C1_URL: http://c1:8001
      C2_URL: http://c2:8002
      C3_URL: http://c3:8003
      C4_URL: http://c4:8004
    volumes:
      - ..:/workspace:ro
    depends_on:
      - c1
      - c2
      - c3
      - c4

  c1:
    build:
      context: ../components/c1_static_analysis
    ports:
      - "8001:8001"
    environment:
      PORT: "8001"
      MONGO_URI: ${MONGO_URI:-mongodb://host.docker.internal:27017}
    volumes:
      - ..:/workspace:ro

  c2:
    build:
      context: ../components/c2_ml_risk
    ports:
      - "8002:8002"
    environment:
      MODEL_PATH: models/saved/risk_detector.pkl

  c3:
    build:
      context: ../components/c3_llm_tests
    ports:
      - "8003:8003"
    environment:
      API_HOST: 0.0.0.0
      API_PORT: "8003"
      GROQ_API_KEY: ${GROQ_API_KEY:-placeholder}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
    volumes:
      - ..:/workspace:ro
      - c3-data:/app/data

  c4:
    build:
      context: ../components/c4_test_eval
    image: r26-se038-c4:local
    ports:
      - "8004:8004"
    environment:
      PORT: "8004"
      SANDBOX_ROOT: /sandbox
      C4_SANDBOX_VOLUME: r26-se038-c4-sandbox
      C4_EVALUATOR_IMAGE: r26-se038-c4:local
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - c4-sandbox:/sandbox

volumes:
  c3-data:
  c4-sandbox:
    name: r26-se038-c4-sandbox
